<div style="padding: 20px; font-family: Arial, sans-serif; border: 1px dashed #0056b3; border-radius: 8px; background-color: #f0f7ff; margin-bottom: 30px;">
<h2 style="margin-top: 0; color: #0056b3;">📢 Publicar Nueva Vacante de Empleo</h2>

<form (ngSubmit)="guardarVacante()" style="display: grid; gap: 10px; max-width: 500px;">
    <div>
      <label style="display: block; font-weight: bold;">Título del Puesto: *</label>
    <input type="text" [(ngModel)]="nuevaVacante.Titulo" name="Titulo" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;" placeholder="Ej: Desarrollador Backend">
    </div>

    <div>
      <label style="display: block; font-weight: bold;">Empresa: *</label>
    <input type="text" [(ngModel)]="nuevaVacante.Empresa" name="Empresa" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;" placeholder="Ej: Unipaz Software">
    </div>

    <div>
    <label style="display: block; font-weight: bold;">Sueldo Mensual ($):</label>
    <input type="number" [(ngModel)]="nuevaVacante.Sueldo" name="Sueldo" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;" placeholder="Ej: 2500000">
    </div>

    <div>
      <label style="display: block; font-weight: bold;">Descripción del Cargo: *</label>
    <textarea [(ngModel)]="nuevaVacante.Descripcion" name="Descripcion" rows="3" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;" placeholder="Escribe las funciones y requisitos..."></textarea>
    </div>

    <button type="submit" style="background-color: #28a745; color: white; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
    🚀 Registrar Vacante en MySQL
    </button>
</form>
</div>
