<div style="padding: 20px; font-family: Arial, sans-serif;">
<h2>Vacantes Disponibles (Bolsa de Empleo Unipaz)</h2>

<div style="display: grid; gap: 15px;">
    <div *ngFor="let v of vacantes">

      <div *ngIf="usuarioLogueado.rol !== 'estudiante' || v.Activo === 1" 
        [style.background-color]="v.Activo === 1 ? '#f9f9f9' : '#e9ecef'"
        [style.border-left]="v.Activo === 1 ? '5px solid #28a745' : '5px solid #6c757d'"
        style="border: 1px solid #ccc; padding: 15px; border-radius: 8px; position: relative;">
        
        <span *ngIf="usuarioLogueado.rol !== 'estudiante'" 
            [style.background-color]="v.Activo === 1 ? '#28a745' : '#6c757d'"
            style="color: white; padding: 2px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; position: absolute; top: 10px; right: 10px;">
        {{ v.Activo === 1 ? 'CONTRATANDO' : 'PAUSADA' }}
        </span>

        <h3 style="margin: 0 0 5px 0; color: #0056b3;">{{ v.Titulo }}</h3>
        <p style="margin: 0 0 10px 0; font-weight: bold; color: #555;">
        🏢 Empresa: {{ v.Empresa }} | 💰 Sueldo: ${{ v.Sueldo }}
        </p>
        <p style="margin: 0; color: #333;">{{ v.Descripcion }}</p>

        <div *ngIf="usuarioLogueado.rol !== 'estudiante'" style="margin-top: 15px; display: flex; gap: 10px;">
        
        <button (click)="iniciarEdicion(v)" style="background-color: #ffc107; color: black; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">
            ✏️ Editar datos
        </button>

        <button (click)="cambiarEstado(v.Id, v.Activo)" 
                [style.background-color]="v.Activo === 1 ? '#6c757d' : '#28a745'" 
                style="color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">
            {{ v.Activo === 1 ? '⏸️ Pausar Oferta' : '▶️ Re-activar Oferta' }}
        </button>
        </div>

    </div>

      <div *ngIf="vacanteEditando && vacanteEditando.Id === v.Id" style="margin-top: 10px; padding: 15px; border: 1px solid #ffc107; background-color: #fffde7; border-radius: 6px;">
        <h4>📝 Modificar Información de la Oferta</h4>
        <div style="display: grid; gap: 8px;">
        <input type="text" [(ngModel)]="vacanteEditando.Titulo" style="padding: 6px;" placeholder="Título">
        <input type="text" [(ngModel)]="vacanteEditando.Empresa" style="padding: 6px;" placeholder="Empresa">
        <input type="number" [(ngModel)]="vacanteEditando.Sueldo" style="padding: 6px;" placeholder="Sueldo">
        <textarea [(ngModel)]="vacanteEditando.Descripcion" rows="2" style="padding: 6px;"></textarea>
        
        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <button (click)="guardarCambios()" style="background-color: #28a745; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer;">💾 Guardar Cambios</button>
            <button (click)="cancelarEdicion()" style="background-color: #dc3545; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer;">Cancelar</button>
        </div>
        </div>
    </div>

    </div>
</div>
</div>
