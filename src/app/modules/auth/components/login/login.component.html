<div style="max-width: 400px; margin: 50px auto; padding: 30px; border: 1px solid #ccc; border-radius: 10px; background-color: #ffffff; box-shadow: 0 4px 8px rgba(0,0,0,0.1); font-family: Arial, sans-serif;">
<h2 style="text-align: center; color: #0056b3; margin-top: 0;">Ingreso al Sistema - Unipaz</h2>
<p style="text-align: center; color: #666; font-size: 14px;">Bolsa de Empleo Multiusuario</p>

<form (ngSubmit)="enviarLogin()" style="display: grid; gap: 15px;">
    <div>
    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Correo Institucional:</label>
    <input type="email" [(ngModel)]="credenciales.correo" name="correo" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;" placeholder="usuario@unipaz.edu.co" required>
    </div>

    <div>
    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Contraseña:</label>
    <input type="password" [(ngModel)]="credenciales.contrasena" name="contrasena" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;" placeholder="••••••••" required>
    </div>

    <button type="submit" style="background-color: #0056b3; color: white; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 16px;">
    Ingresar Plataforma
    </button>
</form>
</div>
